<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.7/css/all.min.css">
  <link rel="icon" href="image/me_icon.png" type="image/png">
  <title>Design | Holly Tianqi Song</title>
  <style>
    :root {
      --accent-color: #D4735E;
      --accent-hover: #B85D48;
      --accent-light: #E8957E;
      --accent-bg: rgba(212, 115, 94, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      color: #37352F;
      line-height: 1.6;
      background: #ffffff;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    a {
      color: var(--accent-color);
      text-decoration: underline;
      text-decoration-color: rgba(212, 115, 94, 0.4);
      transition: all 0.1s ease;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration-color: var(--accent-hover);
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      color: #37352F;
      margin: 1rem 0 0.5rem 0;
      line-height: 1.2;
    }

    h1 a {
      color: #37352F;
      text-decoration: none;
      font-weight: 500;
    }

    h1 a:hover {
      color: #37352F;
    }

    .hero-description {
      font-size: 1em;
      color: rgba(55, 53, 47, 0.65);
      margin: 1rem 0 2rem 0;
      line-height: 1.6;
    }

    /* Fixed Header Styles */
    header.container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      z-index: 1000;
      transition: all 0.3s ease;
      padding: 20px;
      max-width: 100%;
      margin: 0 auto;
      box-shadow: none;
    }

    header.container.scrolled {
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    header.container h1 {
      font-size: 1.8em;
      transition: font-size 0.3s ease;
      margin: 0;
    }

    header.container.scrolled h1 {
      font-size: 1.3em;
    }

    ul.nav-links {
      font-size: 0.9rem;
      margin-top: 8px;
      margin-bottom: 0;
      list-style: none;
      padding: 0;
      transition: all 0.3s ease;
    }

    header.container.scrolled ul.nav-links {
      font-size: 0.75rem;
      margin-top: 4px;
    }

    ul.nav-links li {
      display: inline-block;
      margin: 0 5px;
    }

    ul.nav-links li::before {
      content: '[';
    }

    ul.nav-links li::after {
      content: ']';
    }

    ul.nav-links li a {
      text-decoration: none;
    }

    header.container hr {
      margin-top: 8px;
      margin-bottom: 0;
    }

    /* Add padding to body to account for fixed header */
    body {
      padding-top: 120px;
    }

    body.header-scrolled {
      padding-top: 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 4px 8px;
      font-size: 14px;
      color: rgba(55, 53, 47, 0.65);
      text-decoration: none;
      border-radius: 3px;
      transition: background 0.1s ease;
    }

    .back-link:hover {
      background: rgba(55, 53, 47, 0.08);
    }

    .back-link i {
      font-size: 12px;
    }

    .coming-soon {
      text-align: center;
      padding: 5rem 2rem;
      background: rgba(55, 53, 47, 0.03);
      border: 1px solid rgba(55, 53, 47, 0.06);
      border-radius: 12px;
      margin: 3rem 0;
    }

    .coming-soon i {
      font-size: 3rem;
      color: rgba(55, 53, 47, 0.3);
      margin-bottom: 1.5rem;
    }

    .coming-soon h2 {
      color: #37352F;
      font-size: 1.5em;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .coming-soon p {
      color: rgba(55, 53, 47, 0.65);
      font-size: 0.95em;
    }

    @media (max-width: 767.98px) {
      h1 {
        font-size: 2em;
      }

      .container {
        padding: 40px 20px;
      }

      .coming-soon {
        padding: 3rem 1.5rem;
        margin: 2rem 0;
      }
    }
  </style>
</head>

<body>

  <header class="container">
    <h1 class="float-md-left mb-0">
      <a href="index.html">"Holly" Tianqi Song</a>
    </h1>
    <ul class="list-inline float-md-right nav-links">
      <li class="list-inline-item"><a href="blog.html">Blog</a></li>
      <li class="list-inline-item"><a href="design.html">Design</a></li>
      <li class="list-inline-item"><a href="contact-me.html">Contact Me</a></li>
    </ul>
    <div class="clearfix"></div>
    <hr>
  </header>

  <div class="container">
    <h1 style="margin-top: 2rem;">Design</h1>
    <p class="hero-description">
      Creative explorations in mixed reality, speculative design, and human-centered design across various media.
    </p>

    <div class="coming-soon">
      <i class="fas fa-palette"></i>
      <h2>Coming Soon</h2>
      <p>Design portfolio and projects will be showcased here soon. Stay tuned!</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.4/dist/jquery.min.js"></script>
  <script>
    // Fixed header on scroll
    $(window).on('scroll', function() {
      const header = $('header.container');
      const scrollPosition = $(window).scrollTop();

      if (scrollPosition > 50) {
        header.addClass('scrolled');
        $('body').addClass('header-scrolled');
      } else {
        header.removeClass('scrolled');
        $('body').removeClass('header-scrolled');
      }
    });
  </script>
</body>

</html>
