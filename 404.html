<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>

  <!-- 自动 3 秒后跳转首页 -->
  <meta http-equiv="refresh" content="3; url=https://hollysong.site/">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #2c3e50;
      text-align: center;
      padding: 15vh 20px;
      line-height: 1.6;
    }

    h1 {
      font-size: 72px;
      font-weight: 300;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin: 10px 0;
    }

    a {
      color: #2c3e50;
      text-decoration: none;
      border-bottom: 1px dotted #95a5a6;
    }

    a:hover {
      color: #e74c3c;
      border-bottom-color: #e74c3c;
    }

    .hint {
      font-size: 14px;
      color: #7f8c8d;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>404</h1>
  <p>Sorry, the page you are looking for does not exist.</p>
  <p>You will be redirected to the homepage shortly.</p>

  <p class="hint">
    If you are not redirected,
    <a href="https://hollysong.notion.site/">click here to return to the homepage</a>.
  </p>
</body>
</html>
